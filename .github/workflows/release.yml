name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package source archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f "releases/$TAG.md"
          mkdir -p dist
          prefix="codex-pixel-office-$TAG"
          git archive --format=zip --prefix="$prefix/" HEAD > "dist/$prefix-source.zip"
          git archive --format=tar.gz --prefix="$prefix/" HEAD > "dist/$prefix-source.tar.gz"
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --draft \
            --title "Codex Pixel Office $TAG" --notes-file "releases/$TAG.md"
          gh release upload "$TAG" dist/*
          gh release edit "$TAG" --draft=false --latest
